# Screener Engine Configuration
# Analyst-editable preset definitions and composite quality score weights

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, conservative leverage, positive cash flow, steady 5yr revenue growth"
    filters:
      return_on_equity_pct_min: 15.0
      debt_to_equity_max: 1.0
      free_cash_flow_cr_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Undervalued stocks with reasonable P/E, P/B, manageable debt, healthy dividend yield"
    filters:
      pe_ratio_max: 30.0
      pb_ratio_max: 5.0
      debt_to_equity_max: 2.0
      dividend_yield_pct_min: 0.8

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High profit and revenue 5-year growth with moderate debt"
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      debt_to_equity_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "High dividend yield, sustainable payout ratio below 80%, positive cash flow"
    filters:
      dividend_yield_pct_min: 2.0
      dividend_payout_ratio_pct_max: 80.0
      free_cash_flow_cr_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Virtually debt-free large enterprises with high return on equity and large sales scale"
    filters:
      debt_to_equity_max: 0.10
      return_on_equity_pct_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Accelerating 3-year revenue growth, positive cash flow, declining debt year-over-year"
    filters:
      revenue_cagr_3yr_min: 10.0
      free_cash_flow_cr_min: 0.0
      de_declining_yoy: true

composite_score_weights:
  profitability:
    return_on_equity_pct: 0.15
    roce_percentage: 0.10
    net_profit_margin_pct: 0.10
  cash_quality:
    fcf_score: 0.15
    cfo_pat_ratio: 0.10
    fcf_positive_flag: 0.05
  growth:
    revenue_cagr_5yr: 0.10
    pat_cagr_5yr: 0.10
  leverage:
    debt_to_equity: 0.10
    interest_coverage: 0.05

winsorisation:
  lower_percentile: 10
  upper_percentile: 90
